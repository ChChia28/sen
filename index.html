<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Sen · 记账</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --card-2: #f8f9fa;
    --text: #1a1a1a;
    --text-2: #666;
    --text-3: #b0b0b0;
    --text-4: #e0e0e0;
    --accent: #5EC2C2;
    --accent-dark: #47a8a8;
    --accent-soft: #cfeaea;
    --accent-bg: #e6f4f4;
    --danger: #ff6b6b;
    --income: #6BCB77;
    --line: #f2f2f2;
    --sh-1: 0 2px 10px rgba(0,0,0,0.035);
    --sh-2: 0 6px 22px rgba(0,0,0,0.06);
    --sh-3: 0 10px 40px rgba(0,0,0,0.08);
    --sh-fab: 0 8px 24px rgba(94, 194, 194, 0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
    padding: env(safe-area-inset-top, 0) 0 calc(env(safe-area-inset-bottom, 0) + 90px);
    max-width: 500px;
    margin: 0 auto;
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
  }

  button { border:none; background:none; font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; border: none; outline: none; background: transparent; }

  /* ============== HEADER ============== */
  .app-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 20px 24px 12px;
  }
  .h-left { display: flex; align-items: flex-start; gap: 12px; }
  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
    transition: background .15s;
  }
  .btn-icon:active { background: var(--card-2); }
  .month-picker {
    display: flex; flex-direction: column;
    align-items: flex-start;
    padding: 2px 0;
  }
  .month-picker-main {
    display: flex; align-items: center; gap: 6px;
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.5px;
  }
  .month-picker-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }
  .chevron {
    width: 12px; height: 12px;
    border-right: 2px solid var(--text-2);
    border-bottom: 2px solid var(--text-2);
    transform: rotate(45deg);
    margin-top: -4px;
    margin-left: 2px;
  }

  /* ============== VIEW TOGGLE ============== */
  .view {
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .view.hidden { display: none; }

  /* ============== CALENDAR ============== */
  .calendar { padding: 8px 12px; }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 8px 4px;
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    font-weight: 500;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .day {
    aspect-ratio: 1 / 1.15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 2px 4px;
    border-radius: 12px;
    transition: background .15s;
    position: relative;
  }
  .day.empty { visibility: hidden; }
  .day.has-expense .day-num { color: var(--text); }
  .day-num {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-3);
    line-height: 1;
  }
  .day.today .day-num { color: var(--accent-dark); }
  .day.today::after {
    content: '';
    position: absolute;
    top: 4px; right: 4px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .day-amt {
    font-size: 10.5px;
    color: var(--text-2);
    margin-top: 4px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .day-amt.income { color: var(--income); }
  .day.selected {
    background: var(--card-2);
  }
  .day.selected .day-num { color: var(--text); }

  /* month total for last day like in ref */
  .month-total-mini {
    font-size: 9.5px;
    color: var(--danger);
    margin-top: 2px;
    line-height: 1;
  }

  /* ============== DAY DETAIL LIST ============== */
  .day-detail {
    padding: 26px 20px 8px;
  }
  .day-detail-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .day-detail-title { font-size: 15px; font-weight: 600; }
  .day-detail-title .weekday-txt { color: var(--text-3); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .day-detail-total { font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .txn-list { display: flex; flex-direction: column; gap: 10px; padding: 0 12px 20px; }
  .txn {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: var(--sh-1);
    border: 1px solid var(--line);
    gap: 14px;
    animation: slideUp .3s ease backwards;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .txn:nth-child(1) { animation-delay: 0s; }
  .txn:nth-child(2) { animation-delay: .05s; }
  .txn:nth-child(3) { animation-delay: .1s; }
  .txn:nth-child(4) { animation-delay: .15s; }
  .txn:nth-child(5) { animation-delay: .2s; }
  .txn-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent-bg);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .txn-body { flex: 1; min-width: 0; }
  .txn-cat { font-size: 15px; font-weight: 500; }
  .txn-note {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .txn-amt {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
  }
  .txn-amt.income { color: var(--income); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
  }
  .empty-state-big {
    font-size: 48px;
    font-weight: 300;
    color: var(--text-4);
    margin-bottom: 8px;
    letter-spacing: -1px;
  }
  .empty-state-sub { font-size: 13px; }

  /* ============== CHART VIEW ============== */
  .stats-hero {
    padding: 20px 28px 24px;
  }
  .stats-label {
    font-size: 13px;
    color: var(--text-3);
    letter-spacing: 0.4px;
  }
  .stats-big {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .stats-big .cur { font-size: 22px; font-weight: 500; color: var(--text-2); margin-right: 4px; vertical-align: 6px; }
  .stats-sub {
    display: flex; gap: 20px;
    margin-top: 14px;
    font-size: 13px;
  }
  .stats-sub-item span { color: var(--text-3); margin-right: 6px; }
  .stats-sub-item .v { color: var(--text); font-weight: 600; }
  .stats-sub-item .v.in { color: var(--income); }
  .stats-sub-item .v.out { color: var(--danger); }

  .chart-card {
    background: var(--card);
    margin: 8px 16px 16px;
    padding: 24px 20px;
    border-radius: 22px;
    box-shadow: var(--sh-2);
    border: 1px solid var(--line);
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    max-width: 260px;
    margin: 0 auto;
    aspect-ratio: 1;
  }
  .chart-center {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .chart-center-label { font-size: 11px; color: var(--text-3); }
  .chart-center-val { font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .cat-breakdown {
    padding: 0 16px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .cat-row {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--sh-1);
    border: 1px solid var(--line);
  }
  .cat-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .cat-info { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-bar-outer {
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .cat-bar-inner {
    height: 100%;
    border-radius: 2px;
    transition: width .5s ease;
  }
  .cat-val {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .cat-val-amt { font-size: 15px; font-weight: 600; }
  .cat-val-pct { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* ============== FAB ============== */
  .fab {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0) + 88px);
    right: 22px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 300;
    box-shadow: var(--sh-fab);
    z-index: 10;
    transition: transform .18s;
  }
  .fab:active { transform: scale(.94); }

  /* ============== BOTTOM NAV ============== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 500px;
    margin: 0 auto;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 8px 20px calc(env(safe-area-inset-bottom, 0) + 8px);
    display: flex;
    justify-content: space-around;
    border-top: 1px solid var(--line);
    z-index: 5;
  }
  .nav-btn {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    padding: 8px 24px;
    color: var(--text-3);
    font-size: 11px;
    transition: color .15s;
    border-radius: 10px;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ============== MODAL / SHEET ============== */
  .sheet-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s;
  }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 500px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    z-index: 101;
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.8,.3,1);
    max-height: 90vh;
    overflow-y: auto;
    padding-bottom: calc(env(safe-area-inset-bottom, 0) + 20px);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--text-4);
    border-radius: 2px;
    margin: 12px auto 8px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px 12px;
  }
  .sheet-title { font-size: 17px; font-weight: 600; }
  .sheet-close {
    padding: 6px 12px;
    font-size: 14px;
    color: var(--text-2);
    border-radius: 10px;
  }
  .sheet-save {
    padding: 6px 14px;
    font-size: 14px;
    color: var(--accent);
    font-weight: 600;
    border-radius: 10px;
  }

  /* ============== ADD OPTIONS ============== */
  .add-opts { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .add-opt {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 18px;
    background: var(--card-2);
    border-radius: 18px;
    text-align: left;
    transition: transform .12s;
  }
  .add-opt:active { transform: scale(.98); }
  .add-opt-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--accent-bg);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .add-opt-icon svg { width: 26px; height: 26px; }
  .add-opt-body { flex: 1; }
  .add-opt-title { font-size: 15px; font-weight: 600; }
  .add-opt-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* ============== MANUAL FORM ============== */
  .form-body { padding: 8px 20px 20px; }
  .amount-hero {
    text-align: center;
    padding: 24px 0 20px;
  }
  .amount-label { font-size: 12px; color: var(--text-3); }
  .amount-input {
    font-size: 46px; font-weight: 700;
    text-align: center;
    width: 100%;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
    caret-color: var(--accent);
  }
  .amount-input::placeholder { color: var(--text-4); }
  .type-toggle {
    display: inline-flex;
    background: var(--card-2);
    border-radius: 12px;
    padding: 3px;
    margin-top: 8px;
  }
  .type-toggle button {
    padding: 6px 18px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--text-2);
    transition: background .15s, color .15s;
  }
  .type-toggle button.active {
    background: var(--card);
    color: var(--text);
    box-shadow: var(--sh-1);
    font-weight: 600;
  }

  .cat-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .cat-pick {
    display: flex; flex-direction: column;
    align-items: center;
    padding: 12px 4px;
    border-radius: 14px;
    background: var(--card-2);
    transition: all .15s;
    border: 2px solid transparent;
  }
  .cat-pick.active {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .cat-pick-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .cat-pick-name { font-size: 11px; color: var(--text-2); }
  .cat-pick.active .cat-pick-name { color: var(--text); font-weight: 600; }

  .form-row {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .form-row:last-child { border-bottom: none; }
  .form-row label { font-size: 13px; color: var(--text-2); width: 60px; flex-shrink: 0; }
  .form-row input {
    flex: 1;
    font-size: 15px;
    padding: 4px 0;
  }
  .form-row .date-pick {
    flex: 1;
    display: flex; align-items: center;
    justify-content: space-between;
  }
  .section-label {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 16px;
    margin-bottom: 8px;
    letter-spacing: 0.4px;
  }

  /* ============== VOICE ============== */
  .voice-body { padding: 20px; text-align: center; }
  .mic-wrap {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--accent-bg);
    display: flex; align-items: center; justify-content: center;
    margin: 20px auto;
    position: relative;
    transition: transform .2s;
  }
  .mic-wrap.recording {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(94,194,194,.45); }
    50% { box-shadow: 0 0 0 30px rgba(94,194,194,0); }
  }
  .mic-icon {
    width: 60px; height: 60px;
    color: var(--accent);
  }
  .mic-wrap.recording .mic-icon { color: var(--accent-dark); }
  .voice-status {
    font-size: 15px;
    color: var(--text-2);
    margin-top: 10px;
    min-height: 22px;
  }
  .voice-transcript {
    min-height: 80px;
    padding: 16px;
    background: var(--card-2);
    border-radius: 16px;
    margin: 20px 12px;
    text-align: left;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
  }
  .voice-transcript.placeholder { color: var(--text-3); text-align: center; }
  .voice-actions {
    display: flex; gap: 12px;
    padding: 0 12px 8px;
  }
  .voice-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    transition: background .15s;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-primary:disabled { background: var(--text-4); color: white; }
  .btn-secondary {
    background: var(--card-2);
    color: var(--text-2);
  }

  /* ============== IMPORT ============== */
  .import-body { padding: 8px 20px 20px; }
  .drop-zone {
    border: 2px dashed var(--text-4);
    border-radius: 20px;
    padding: 36px 20px;
    text-align: center;
    color: var(--text-3);
    transition: border-color .15s, background .15s;
    margin: 8px 0 16px;
  }
  .drop-zone.drag { border-color: var(--accent); background: var(--accent-bg); }
  .drop-zone svg {
    width: 48px; height: 48px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .drop-zone-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .drop-zone-sub { font-size: 12px; margin-top: 4px; }
  .file-buttons {
    display: flex; gap: 10px;
    margin-bottom: 16px;
  }
  .file-btn {
    flex: 1;
    padding: 14px;
    background: var(--card-2);
    border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-size: 13px;
  }
  .file-btn svg { width: 24px; height: 24px; color: var(--accent); }
  .file-preview {
    margin: 12px 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .file-preview img {
    width: 100%; max-height: 200px;
    object-fit: contain;
    border-radius: 12px;
    background: var(--card-2);
  }
  .file-info {
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    background: var(--card-2);
    border-radius: 12px;
    font-size: 13px;
  }
  .file-info-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-info-remove { color: var(--danger); font-size: 20px; padding: 0 6px; }
  .parse-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: white;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .parse-btn:disabled { background: var(--text-4); }
  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============== PARSED RESULTS ============== */
  .parsed-list {
    padding: 8px 12px 12px;
    display: flex; flex-direction: column; gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .parsed-item {
    background: var(--card-2);
    border-radius: 16px;
    padding: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .parsed-item.exclude { opacity: 0.45; }
  .parsed-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--text-4);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .15s;
  }
  .parsed-item:not(.exclude) .parsed-check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .parsed-check svg { width: 14px; height: 14px; }
  .parsed-body { flex: 1; min-width: 0; }
  .parsed-body-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .parsed-cat { font-size: 14px; font-weight: 600; }

  /* ============== TOAST ============== */

<script>
/* ============ CATEGORIES ============ */
const CATS = {
  expense: [
    { key: '外食',   icon: '🍚', color: '#5EC2C2' },
    { key: '交通',   icon: '🚗', color: '#FFA76B' },
    { key: '购物',   icon: '🛍', color: '#FF7EB3' },
    { key: '生活',   icon: '🏠', color: '#7FB4FF' },
    { key: '娱乐',   icon: '🎬', color: '#B78FFF' },
    { key: '医疗',   icon: '💊', color: '#FF8080' },
    { key: '教育',   icon: '📚', color: '#8BD17C' },
    { key: '通讯',   icon: '📱', color: '#F4C15C' },
    { key: '旅行',   icon: '✈️', color: '#5CC7A3' },
    { key: '人情',   icon: '🎁', color: '#F498B0' },
    { key: '烟酒',   icon: '🍺', color: '#B48A6B' },
    { key: '其他',   icon: '💰', color: '#A0A0A0' },
  ],
  income: [
    { key: '工资',   icon: '💼', color: '#6BCB77' },
    { key: '兼职',   icon: '💻', color: '#5EC2C2' },
    { key: '红包',   icon: '🧧', color: '#FF8080' },
    { key: '理财',   icon: '📈', color: '#7FB4FF' },
    { key: '退款',   icon: '↩️', color: '#B78FFF' },
    { key: '其他',   icon: '💰', color: '#A0A0A0' },
  ],
};
const catMap = {};
[...CATS.expense, ...CATS.income].forEach(c => catMap[c.key] = c);
const getCat = (name, type='expense') => (CATS[type].find(c => c.key === name) || catMap[name] || CATS.expense[CATS.expense.length-1]);

/* ============ STATE ============ */
const STORAGE_KEY = 'jizhang.v1';
let state = { transactions: [] };
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) state = JSON.parse(raw);
} catch {}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

// Seed with a bit of data if empty
if (state.transactions.length === 0) {
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth();
  const mk = (d, cat, amt, note, type='expense') => ({
    id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
    date: fmtDate(new Date(y, m, d)),
    category: cat, amount: amt, note, type,
    createdAt: Date.now(),
  });
  state.transactions = [
    mk(Math.max(1, today.getDate()-2), '外食', 25.5, '午饭'),
    mk(Math.max(1, today.getDate()-2), '交通', 8.0, 'Grab'),
    mk(Math.max(1, today.getDate()-1), '购物', 128.9, '日用品'),
    mk(today.getDate(), '外食', 15, '早餐 kopitiam'),
    mk(1, '工资', 3500, '月薪', 'income'),
  ];
  save();
}

/* ============ UTIL ============ */
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtMoney(n, cur='$') {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  const s = abs >= 1000 ? abs.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (abs % 1 ? '.' + abs.toFixed(2).split('.')[1] : '') : abs.toFixed(abs >= 10 ? (abs % 1 ? 2 : 0) : 2);
  return `${cur} ${s}`;
}
function fmtShort(n) {
  const v = Number(n) || 0;
  if (v >= 1000) return v.toFixed(v >= 10000 ? 0 : 1);
  if (v >= 100) return v.toFixed(v % 1 ? 2 : 0);
  return v.toFixed(v % 1 ? 2 : 0);
}
const WEEK_ZH = ['日','一','二','三','四','五','六'];
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  const dur = ms || (msg.length > 30 ? 5000 : 1800);
  toast._t = setTimeout(() => t.classList.remove('show'), dur);
}
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];

/* ============ VIEW STATE ============ */
const today = new Date();
let currentView = 'calendar';
let cursorYear = today.getFullYear();
let cursorMonth = today.getMonth(); // 0-indexed
let selectedDate = fmtDate(today);
let pieChart = null;

/* ============ RENDER: HEADER ============ */
function renderHeader() {
  $('#hdrMonth').textContent = `${cursorYear} / ${String(cursorMonth+1).padStart(2,'0')}`;
  const now = new Date();
  const nowY = now.getFullYear(), nowM = now.getMonth();
  const diffM = (nowY - cursorYear) * 12 + (nowM - cursorMonth);
  let sub;
  if (diffM === 0) sub = '本月';
  else if (diffM === 1) sub = '上个月';
  else if (diffM === -1) sub = '下个月';
  else if (diffM > 0) sub = `${diffM} 个月前`;
  else sub = `${Math.abs(diffM)} 个月后`;
  $('#hdrRel').textContent = sub;
}

/* ============ RENDER: CALENDAR ============ */
function renderCalendar() {
  const grid = $('#calGrid');
  grid.innerHTML = '';
  const firstDay = new Date(cursorYear, cursorMonth, 1);
  const daysInMonth = new Date(cursorYear, cursorMonth+1, 0).getDate();
  const startWeekday = firstDay.getDay(); // Sun = 0
  const todayStr = fmtDate(today);
  const monthPrefix = `${cursorYear}-${String(cursorMonth+1).padStart(2,'0')}`;
  const monthTxns = state.transactions.filter(t => t.date.startsWith(monthPrefix));
  const byDay = {};
  monthTxns.forEach(t => {
    const d = t.date.slice(-2);
    if (!byDay[d]) byDay[d] = { expense: 0, income: 0 };
    byDay[d][t.type] += Number(t.amount) || 0;
  });
  let monthTotalExpense = 0, monthTotalIncome = 0;
  monthTxns.forEach(t => { if (t.type === 'expense') monthTotalExpense += +t.amount; else monthTotalIncome += +t.amount; });

  // Empty cells before day 1
  for (let i = 0; i < startWeekday; i++) {
    const el = document.createElement('div');
    el.className = 'day empty';
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = String(d).padStart(2, '0');
    const info = byDay[key];
    const dateStr = `${monthPrefix}-${key}`;
    const el = document.createElement('div');
    el.className = 'day';
    if (info) el.classList.add('has-expense');
    if (dateStr === todayStr) el.classList.add('today');
    if (dateStr === selectedDate) el.classList.add('selected');
    el.dataset.date = dateStr;
    let inner = `<div class="day-num">${d}</div>`;
    if (info) {
      if (info.expense > 0) {
        inner += `<div class="day-amt">$ ${fmtShort(info.expense)}</div>`;
      } else if (info.income > 0) {
        inner += `<div class="day-amt income">+${fmtShort(info.income)}</div>`;
      }
    }
    // On last day show monthly negative total in accent red-like (like reference)
    if (d === daysInMonth && monthTotalExpense > 0) {
      inner += `<div class="month-total-mini">${fmtShort(monthTotalExpense)}</div>`;
    }
    el.innerHTML = inner;
    el.addEventListener('click', () => {
      selectedDate = dateStr;
      renderCalendar();
      renderDayDetail();
    });

/* ============ RENDER: DAY DETAIL ============ */
function renderDayDetail() {
  const d = parseDate(selectedDate);
  const dayStr = `${String(d.getMonth()+1).padStart(2,'0')} / ${String(d.getDate()).padStart(2,'0')}`;
  $('#ddDate').textContent = dayStr;
  $('#ddWk').textContent = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const dayTxns = state.transactions
    .filter(t => t.date === selectedDate)
    .sort((a, b) => b.createdAt - a.createdAt);
  const total = dayTxns.reduce((s, t) => s + (t.type === 'expense' ? +t.amount : 0), 0);
  const income = dayTxns.reduce((s, t) => s + (t.type === 'income' ? +t.amount : 0), 0);
  $('#ddTotal').innerHTML = total > 0 ? `<span style="color:var(--text-3)">支出</span> $ ${fmtShort(total)}` + (income>0 ? ` <span style="color:var(--income); margin-left:8px;">+${fmtShort(income)}</span>` : '') : (income > 0 ? `<span style="color:var(--income)">+${fmtShort(income)}</span>` : '');

  const list = $('#txnList');
  if (dayTxns.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-big">·</div><div class="empty-state-sub">这天还没记账，点右下 + 加一笔</div></div>`;
    return;
  }
  list.innerHTML = dayTxns.map(t => {
    const c = getCat(t.category, t.type);
    const sign = t.type === 'income' ? '+' : '';
    return `<div class="txn" data-id="${t.id}">
      <div class="txn-icon" style="background:${c.color}22; color:${c.color}">${c.icon}</div>
      <div class="txn-body">
        <div class="txn-cat">${t.category}</div>
        <div class="txn-note">${t.note || (t.type === 'income' ? '收入' : '支出')}</div>
      </div>
      <div class="txn-amt ${t.type === 'income' ? 'income' : ''}">${sign}$ ${fmtShort(t.amount)}</div>
    </div>`;
  }).join('');
  $$('.txn', list).forEach(el => {
    el.addEventListener('click', () => openTxnActions(el.dataset.id));
  });
}

/* ============ RENDER: CHART VIEW ============ */
function renderChart() {
  const monthPrefix = `${cursorYear}-${String(cursorMonth+1).padStart(2,'0')}`;
  const monthTxns = state.transactions.filter(t => t.date.startsWith(monthPrefix));
  const expenseTxns = monthTxns.filter(t => t.type === 'expense');
  const incomeTxns = monthTxns.filter(t => t.type === 'income');
  const totalExp = expenseTxns.reduce((s, t) => s + +t.amount, 0);
  const totalIn = incomeTxns.reduce((s, t) => s + +t.amount, 0);
  const bal = totalIn - totalExp;

  $('#statTotal').textContent = fmtShort(totalExp);
  $('#statIn').textContent = `$ ${fmtShort(totalIn)}`;
  const balEl = $('#statBal');
  balEl.textContent = `${bal >= 0 ? '' : '-'}$ ${fmtShort(Math.abs(bal))}`;
  balEl.className = 'v ' + (bal >= 0 ? 'in' : 'out');
  $('#chartCenterVal').textContent = `$ ${fmtShort(totalExp)}`;

  // Group by cat
  const byCat = {};
  expenseTxns.forEach(t => {
    if (!byCat[t.category]) byCat[t.category] = 0;
    byCat[t.category] += +t.amount;
  });
  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const labels = sorted.map(([k]) => k);
  const values = sorted.map(([,v]) => v);
  const colors = sorted.map(([k]) => getCat(k, 'expense').color);

  // Pie chart
  const canvas = $('#pieChart');
  if (pieChart) pieChart.destroy();
  if (values.length === 0) {
    pieChart = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: ['无数据'],
        datasets: [{ data: [1], backgroundColor: ['#f2f2f2'], borderWidth: 0 }],
      },
      options: {
        cutout: '68%',
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        animation: { duration: 400 },
      },
    });
  } else {
    pieChart = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data: values, backgroundColor: colors, borderWidth: 3, borderColor: '#fff', hoverOffset: 6 }],
      },
      options: {
        cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => `${ctx.label}: $ ${fmtShort(ctx.parsed)}`,
            },
          },
        },
        animation: { animateRotate: true, duration: 500 },
      },
    });
  }

  // Breakdown
  const bd = $('#catBreakdown');
  if (sorted.length === 0) {
    bd.innerHTML = `<div class="empty-state"><div class="empty-state-big">·</div><div class="empty-state-sub">本月还没有支出记录</div></div>`;
    return;
  }
  bd.innerHTML = sorted.map(([k, v]) => {
    const c = getCat(k, 'expense');
    const pct = totalExp > 0 ? (v / totalExp * 100) : 0;
    return `<div class="cat-row">
      <div class="cat-dot" style="background:${c.color}22; color:${c.color}">${c.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${k}</div>
        <div class="cat-bar-outer"><div class="cat-bar-inner" style="width:${pct}%; background:${c.color}"></div></div>
      </div>
      <div class="cat-val">
        <div class="cat-val-amt">$ ${fmtShort(v)}</div>
        <div class="cat-val-pct">${pct.toFixed(1)}%</div>
      </div>
    </div>`;
  }).join('');
}

  $('#micBtn').classList.remove('recording');

$('#micBtn').addEventListener('click', () => {
  if (!recognition) recognition = initSpeech();
  if (!recognition) {
    // Fallback: let user type
    const t = prompt('浏览器不支持语音识别，试试直接输入吧（例如：午饭 25 块 麦当劳）');
    if (t) {
      voiceText = t.trim();
      $('#voiceTranscript').textContent = voiceText;
      $('#voiceTranscript').classList.remove('placeholder');
      $('#voiceParse').disabled = !voiceText;
    }
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  let finalText = voiceText;
  recognition.onstart = () => {
    recognizing = true;
    $('#micBtn').classList.add('recording');
    $('#voiceStatus').textContent = '正在听… 再点一下结束';
  };
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const s = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += s;
      else interim += s;
    }
    const shown = (finalText + interim).trim();
    if (shown) {
      $('#voiceTranscript').textContent = shown;
      $('#voiceTranscript').classList.remove('placeholder');
      $('#voiceParse').disabled = false;
    }
  };
  recognition.onerror = (e) => {
    recognizing = false;
    $('#micBtn').classList.remove('recording');
    $('#voiceStatus').textContent = '出错啦：' + (e.error || '未知');
  };
  recognition.onend = () => {
    recognizing = false;
    $('#micBtn').classList.remove('recording');
    voiceText = finalText.trim();
    $('#voiceStatus').textContent = voiceText ? '好了，点下面 AI 解析' : '没听清，再试一次';
  };
  try { recognition.start(); }
  catch (err) { toast('语音启动失败'); }
});

/* ---------- File parsers ---------- */
async function parseFileToTxns(file) {
  const kind = detectFileKind(file);
  let rows;
  if (kind === 'excel') rows = await parseExcelFile(file);
  else if (kind === 'csv') rows = parseCsvText(await file.text());
  else if (kind === 'txt') rows = parseTxtText(await file.text());
  else throw new Error('不支持这个文件类型');
  if (!rows || rows.length === 0) throw new Error('文件是空的');
  const detected = detectColumns(rows);
  if (!detected) throw new Error('找不到列头 (Date / Description / Amount)');
  return rowsToTxns(rows, detected);
}

async function parseExcelFile(file) {
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error('Excel 解析库没加载');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
}

function parseCsvText(text) {
  const lines = text.split(/\r?\n/);
  return lines.map(parseCsvLine).filter(r => r.some(c => String(c).trim()));
}
function parseCsvLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += c;
    }
  }
  result.push(current);
  return result;
}
function parseTxtText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  // detect delimiter: tab, then 2+ spaces, then | 
  const sample = lines.slice(0, 5).join('\n');
  let delim;
  if (sample.includes('\t')) delim = /\t/;
  else if (sample.includes('|')) delim = /\s*\|\s*/;
  else delim = /\s{2,}/;
  return lines.map(l => l.split(delim));
}

/* ---------- Column detection ---------- */
const COL_PATTERNS = {
  date: /^(transaction[\s_-]?)?(post(ing)?[\s_-]?)?(trans\.?[\s_-]?)?(value[\s_-]?)?(date|tarikh|日期|时间|交易日期)/i,
  desc: /(description|narration|details?|remark|memo|particular|merchant|transaction[\s_-]?description|详情|备注|商家|摘要|说明|交易描述)/i,
  amount: /^((transaction|txn)[\s_-]?)?(amount|jumlah|金额|数额)$/i,
  debit: /(debit|withdrawal|支出|out|dr\.?)/i,
  credit: /(credit|deposit|收入|in|cr\.?)/i,
};
function detectColumns(rows) {
  for (let i = 0; i < Math.min(20, rows.length); i++) {
    const row = rows[i];
    if (!row || row.length < 2) continue;
    const cols = {};
    row.forEach((cell, idx) => {
      const s = String(cell || '').trim();
      if (!s) return;
      for (const [key, pattern] of Object.entries(COL_PATTERNS)) {
        if (cols[key] == null && pattern.test(s)) {
          cols[key] = idx;
          break;
        }
      }
    });
    if (cols.date != null && (cols.amount != null || cols.debit != null || cols.credit != null)) {
      return { headerRow: i, cols };
    }
  }
  return null;
}

/* ---------- Date & amount parsers ---------- */
function parseFlexDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v.getTime())) return fmtDate(v);
  const s = String(v).trim();
  if (!s) return null;
  // Excel serial number (rough)
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (d.getFullYear() > 1990 && d.getFullYear() < 2100) return fmtDate(d);
  }
  // YYYY-MM-DD or YYYY/MM/DD
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // DD-MM-YYYY or DD/MM/YYYY (Malaysia common)
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // DD-MM-YY
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2})(?!\d)/);
  if (m) {
    const yy = parseInt(m[3]);
    const yyyy = yy < 70 ? 2000 + yy : 1900 + yy;
    return `${yyyy}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  // DD MMM YYYY (e.g. "05 Sep 2026")
  m = s.match(/^(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i);
  if (m) {
    const months = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
    const mm = months[m[2].toLowerCase()];
    return `${m[3]}-${String(mm).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  // Native parse as last resort
  const d = new Date(s);
  if (!isNaN(d.getTime()) && d.getFullYear() > 1990) return fmtDate(d);
  return null;
}
function parseAmount(v) {
  if (v == null || v === '') return null;
  let s = String(v).trim();
  if (!s) return null;
  // Handle "1,234.56" and "(1,234.56)" (parentheses = negative in some formats)
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('DR') || s.endsWith('CR')) {
    if (s.endsWith('DR')) neg = true;
    s = s.slice(0, -2).trim();
  }
  const clean = s.replace(/[^\d.\-]/g, '');
  if (!clean || clean === '-' || clean === '.') return null;
  let n = parseFloat(clean);
  if (isNaN(n)) return null;
  if (neg) n = -Math.abs(n);
  return n;
}

  医疗: ['klinik','pharmacy','watsons','guardian','caring pharmacy','hospital','apotek','panel klinik','clinic','dental'],

  烟酒: ['carlsberg','tiger beer','heineken','marlboro','dunhill','tobacco','liquor'],
};
const KW_INCOME = {
  工资: ['salary','gaji','payroll','wage','monthly','mthly'],
  兼职: ['freelance','commission','komisyen','part time','parttime'],
  红包: ['ang pow','angpow'],
  退款: ['refund','reversal','pemulangan','chargeback'],
  理财: ['dividend','interest','kwsp','epf','bonus','faedah'],
};
function categorize(desc, isIncome) {
  const s = String(desc || '').toLowerCase();
  const map = isIncome ? KW_INCOME : KW_EXPENSE;
  for (const [cat, kws] of Object.entries(map)) {
    for (const kw of kws) {
      if (s.includes(kw)) return cat;
    }
  }
  return '其他';
}

/* ---------- Rows → transactions ---------- */
function rowsToTxns(rows, detected) {
  const { cols, headerRow } = detected;
  const items = [];
  const today = fmtDate(new Date());
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    // Skip rows that look like totals/summary
    const asStr = row.map(c => String(c || '').trim()).join(' ').toLowerCase();
    if (!asStr) continue;
    if (/^(total|subtotal|balance|closing|opening|jumlah|end(ing)? bal)/i.test(String(row[cols.desc] ?? row[cols.date] ?? ''))) continue;

    const dateStr = parseFlexDate(row[cols.date]);
    const desc = String(row[cols.desc] ?? '').trim();

    let amount = null, type = null;
    if (cols.debit != null || cols.credit != null) {
      const debit = parseAmount(row[cols.debit]);
      const credit = parseAmount(row[cols.credit]);
      if (debit && Math.abs(debit) > 0.001) { amount = Math.abs(debit); type = 'expense'; }
      else if (credit && Math.abs(credit) > 0.001) { amount = Math.abs(credit); type = 'income'; }
    } else if (cols.amount != null) {
      const amt = parseAmount(row[cols.amount]);
      if (amt != null && Math.abs(amt) > 0.001) {
        amount = Math.abs(amt);
        type = amt < 0 ? 'expense' : 'income';
      }
    }
    if (amount == null || !type) continue;
    if (!dateStr && !desc) continue;

    const category = categorize(desc, type === 'income');
    items.push({
      id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
      type, category, amount,
      note: desc.slice(0, 60),
      date: dateStr || today,
      createdAt: Date.now(),
      include: true,
    });
  }
  return items;
}

/* ============ AI PARSING (via /api serverless functions) ============ */

async function parseTextToTxns(text) {
  const res = await fetch('/api/parse-text', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      today: fmtDate(new Date()),
      expense_categories: CATS.expense.map(c => c.key),
      income_categories: CATS.income.map(c => c.key),
    }),
  });
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch {}
    throw { code: body?.code || (res.status === 401 ? 'no_key' : 'server_error'), message: body?.error };
  }
  const data = await res.json();
  const items = Array.isArray(data) ? data : (data.items || []);
  return normalizeItems(items);
}

function normalizeItems(items) {
  const out = [];
  const today = fmtDate(new Date());
  for (const it of items || []) {
    if (!it) continue;
    const type = (it.type === 'income') ? 'income' : 'expense';
    const cats = CATS[type];
    let cat = it.category;
    if (!cats.find(c => c.key === cat)) cat = cats[cats.length - 1].key; // 其他
    const amt = Number(String(it.amount ?? '').replace(/[^\d.\-]/g, '')) || 0;
    if (!(amt > 0)) continue;
    let date = it.date;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date))) date = today;
    out.push({
      id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
      type, category: cat, amount: amt,
      note: (it.note || '').toString().slice(0, 60),
      date,
      createdAt: Date.now(),
      include: true,
    });
  }
  return out;
}

function naiveTextParse(text) {
  // very rough fallback if no AI
  const m = text.match(/(\d+(?:\.\d+)?)/);
  if (!m) return [];
  const amt = parseFloat(m[1]);
  const t = /收入|工资|退款|红包/.test(text) ? 'income' : 'expense';
  const cats = CATS[t];
  let cat = '其他';
  const kws = {
    '外食': ['吃','饭','餐','麦','肯','早饭','午饭','晚饭','奶茶','咖啡','kopi'],
    '交通': ['打车','grab','车','油','停车','地铁','公交'],
    '购物': ['买','shopee','lazada','商场','买了'],
    '生活': ['水电','房租','日用'],
    '娱乐': ['电影','游戏','ktv'],
  };
  for (const [k, ws] of Object.entries(kws)) {
    if (ws.some(w => text.includes(w))) { cat = k; break; }
  }
  return [{
    id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2),
    type: t, category: cat, amount: amt, note: text.slice(0, 40),
    date: fmtDate(new Date()), createdAt: Date.now(), include: true,
  }];
}

function claudeErrCopy(e) {
  if (!e) return '出错了';
  if (e.code === 'no_key') return '服务端没设置 API key';
  if (e.code === 'rate_limited') return '用得太快啦，稍等一下';
  if (e.code === 'too_large') return '图片太大，试试拍小张一点';
  if (e.code === 'refused') return 'AI 拒绝了';
  if (e.code === 'invalid_json') return 'AI 回复格式不对';
  if (e.code === 'no_image') return '没有可以解析的图片';
  if (e.code === 'server_error') {
    console.error('[Sen] server error:', e);
    const msg = (e.message || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    return msg ? '错: ' + msg : '服务端出错';
  }
  return '解析失败，试试手动记';
}

$('#parsedSave').addEventListener('click', () => {

/* ============ MONTH PICKER ============ */
function openMonthPicker() {
  const list = $('#monthList');
  list.innerHTML = '';
  const nowY = new Date().getFullYear();
  const startY = Math.min(cursorYear, nowY) - 2;
  const endY = Math.max(cursorYear, nowY) + 1;
  const cells = [];
  for (let y = endY; y >= startY; y--) {
    cells.push(`<div class="year-header">${y}</div>`);
    for (let m = 0; m < 12; m++) {
      const isNow = (y === nowY && m === new Date().getMonth());
      const isSel = (y === cursorYear && m === cursorMonth);
      const cls = 'month-cell' + (isNow ? ' current' : '') + (isSel && !isNow ? ' selected' : '');
      cells.push(`<div class="${cls}" data-y="${y}" data-m="${m}">${String(m+1).padStart(2,'0')} 月</div>`);
    }
  }
  list.innerHTML = cells.join('');
  $$('.month-cell', list).forEach(el => {
    el.addEventListener('click', () => {
      cursorYear = +el.dataset.y;
      cursorMonth = +el.dataset.m;
      selectedDate = fmtDate(new Date(cursorYear, cursorMonth, Math.min(new Date().getDate(), new Date(cursorYear, cursorMonth+1, 0).getDate())));
      closeSheet('sheetMonth');
      renderAll();
    });
  });
  openSheet('sheetMonth');
  // scroll current row into view
  setTimeout(() => {
    const cur = list.querySelector('.month-cell.current, .month-cell.selected');
    cur?.scrollIntoView({ block: 'center' });
  }, 100);
}
$('#btnMonthPick').addEventListener('click', openMonthPicker);
$('#monthGoToday').addEventListener('click', () => {
  const now = new Date();
  cursorYear = now.getFullYear();
  cursorMonth = now.getMonth();
  selectedDate = fmtDate(now);
  closeSheet('sheetMonth');
  renderAll();
});
$('#btnToday').addEventListener('click', () => {
  const now = new Date();
  cursorYear = now.getFullYear();
  cursorMonth = now.getMonth();
  selectedDate = fmtDate(now);
  renderAll();
});
